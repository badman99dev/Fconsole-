name: Build and Purge jsdelivr Cache

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build eruda
        run: |
          rm -rf dist
          node_modules/.bin/webpack --config build/webpack.prod.js

      - name: Commit built dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/eruda.js dist/eruda.js.map
          git diff --staged --quiet || git commit -m "chore: auto-build dist [skip ci]"
          git push

      - name: Purge jsdelivr CDN cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@master/dist/eruda.js"
          echo ""
          echo "Purge request sent for dist/eruda.js"
